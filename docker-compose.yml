name: cron-service
services:
  cron-service:
    build: .
    image: manual-async-job:local
    init: true
    stop_grace_period: 2m
    environment:
      JOB_MODE: ${JOB_MODE:-cron}
      NODE_APP_INSTANCE: '0'
      NODE_APP_INSTANCES: '1'
    volumes:
      - ./logs:/app/logs
      - ./secret:/app/secret
    env_file:
      - .env
    networks:
      - icorn-network

networks:
  icorn-network:
    driver: bridge
    name: icorn-network
